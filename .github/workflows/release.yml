name: Release

# Build and publish the .vsix as a GitHub Release whenever a version tag is pushed.
# Usage: bump version in package.json, then:
#   git tag v0.0.1 && git push origin v0.0.1

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx vsce package --allow-missing-repository

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VSIX=$(ls *.vsix | head -n 1)
          echo "Releasing $VSIX"
          gh release create "${GITHUB_REF_NAME}" "$VSIX" \
            --title "Inner Loop Code ${GITHUB_REF_NAME}" \
            --notes "Install locally:\n\n\`\`\`bash\ncode --install-extension $VSIX\n\`\`\`\n\nRequires VS Code and a local Ollama instance (\`ollama serve\` + \`ollama pull qwen3-coder\`)."
