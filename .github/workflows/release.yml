name: Release

# Build and publish the .vsix as a GitHub Release whenever a version tag is pushed.
# Usage: bump version in package.json, then:
#   git tag v0.0.1 && git push origin v0.0.1

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx vsce package --allow-missing-repository

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VSIX=$(ls *.vsix | head -n 1)
          echo "Releasing $VSIX"
          cat > notes.md <<EOF
          ## Inner Loop Code ${GITHUB_REF_NAME}

          Local-first AI coding agent for VS Code, powered by Ollama.

          ### Install
          \`\`\`bash
          code --install-extension $VSIX
          \`\`\`

          Requires VS Code and a local Ollama instance:
          \`\`\`bash
          ollama serve
          ollama pull qwen3-coder
          \`\`\`
          EOF
          gh release create "${GITHUB_REF_NAME}" "$VSIX" \
            --title "Inner Loop Code ${GITHUB_REF_NAME}" \
            --notes-file notes.md
